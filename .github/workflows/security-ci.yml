# Sandbox/teaching only; for authorized lab use.
#
# Week 15 — DevSecOps security gate (GitHub Actions LAB TEMPLATE).
# This file lives in the lab dir. To activate it, copy it to
#   .github/workflows/security-ci.yml
# in a repo (see README-pipeline.md).
#
# It runs four security tools and FAILS the build on HIGH/CRITICAL:
#   - Semgrep  (SAST)            CWE-coverage via OWASP rulesets
#   - Trivy    (SCA + image + IaC)
#   - Gitleaks (secret scanning)
# SARIF results upload to the GitHub "Security" tab even when a scan fails
# (the upload steps use `if: always()`), so reviewers still see findings.
#
# OWASP 2025: A03 (supply chain), A02 (misconfig), A09 (logging/alerting).


# Sandbox/teaching only; for authorized lab use.
# Week 15 - DevSecOps Security CI Pipeline

name: security-ci

on:
  push:
    branches: [main, wk15]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # --------------------------------------------------
  # 1. Semgrep - Static Application Security Testing
  # --------------------------------------------------
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Semgrep scan to SARIF
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif \
            --error || true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Gate - fail on Semgrep findings
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --error

  # --------------------------------------------------
  # 2. Trivy - SCA and IaC Security Scanning
  # --------------------------------------------------
  trivy:
    name: SCA + IaC (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Dependency and secret scanning - report
      - name: Trivy FS scan to SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Infrastructure configuration scanning - report
      - name: Trivy Config scan to SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy Config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # Security gates - fail build on HIGH/CRITICAL
      - name: Gate - fail on HIGH/CRITICAL SCA findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Gate - fail on HIGH/CRITICAL IaC findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "1"

  # --------------------------------------------------
  # 3. Gitleaks - Secret Scanning
  # --------------------------------------------------
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Gitleaks scan to SARIF
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect -s /repo \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif \
            --exit-code 0 -v || true

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Gate - fail if secrets are found
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect -s /repo \
            --exit-code 1 -v
